<!DOCTYPE html>

<head>

    <style>
        /* CSS 樣式 (大部分不變) */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .controls {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
            margin: 0 5px; /* 增加按鈕間距 */
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #c0c0c0;
            cursor: not-allowed;
        }
        
        /* *** 新增：設定視窗內的按鈕樣式 *** */
        .modal-buttons {
            margin-top: 20px;
            text-align: right;
            display: flex;
            justify-content: space-between; /* 讓按鈕分開 */
        }
        
        .modal-buttons .btn-save {
            background-color: #007bff; /* 儲存 (藍色) */
        }
        .modal-buttons .btn-cancel {
            background-color: #6c757d; /* 取消 (灰色) */
        }
        .modal-buttons .btn-restore {
            background-color: #dc3545; /* 恢復預設 (紅色) */
            margin-right: auto; /* 推到最左邊 */
        }
        /* (樣式結束) */


        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }

        .nav-btn {
            background-color: #6c757d;
            padding: 10px 20px;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #5a6268;
        }

        .card-info {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            text-align: center;
            min-width: 120px;
        }

        .word-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            background: #fafafa;
            transition: border-color 0.3s;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 250px; 
        }

        .word-card.correct {
            border-color: #28a745;
            background-color: #EEFFEE;
        }

        .word-card.incorrect {
            border-color: #dc3545;
            background-color: #FFEEEE;
        }

        .word-number {
            font-weight: bold;
            color: #666;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .word-display {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .word-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .speak-btn {
            background-color: #17a2b8;
            padding: 10px;
            font-size: 16px;
        }

        .speak-btn:hover {
            background-color: #1a7e91;
        }

        .word-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;

            border-color: #007bff;
        }

            color: #333;
            padding: 10px;
            font-size: 16px;
        }

        }

            text-align: center;
            font-weight: bold;
            font-size: 18px;
            line-height: 1.6;
        }

        .result.correct { color: #28a745; }
        .result.incorrect { color: #dc3545; }

            color: #0056b3; 
            font-size: 17px;
            font-weight: bold;
            margin-top: 10px;
        }

        .sentence-display {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            line-height: 1.7;

        .sentence-en {
            color: #333; 
            font-size: 15px;
            font-style: italic;
            font-weight: normal;
        }

        .sentence-zh {
            color: #555;

            font-weight: normal;

            background: none;
            border: none;

            font-size: 16px;

        }

            font-size: 20px;
            font-weight: bold;
            color: #007bff;
        }

            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
    </style>
</head>

        <div class="controls">

            <button onclick="resetAll()">重置進度</button>
        </div>

        
        <div class="navigation">
            <button class="nav-btn" id="prevBtn" onclick="prevCard()">上一張</button>
            <span id="cardInfo" class="card-info">...</span>

        <div class="word-card" id="wordCard">
            </div>

                <div class="stat-item">

            { word: 'tell', translation: '告訴', sentence_en: 'Tell me a story.', sentence_zh: '告訴我一個故事。' },
            { word: 'think', translation: '想', sentence_en: 'What do you think?', sentence_zh: '你怎麼想？' },
            { word: 'use', translation: '使用', sentence_en: 'Can I use your pen?', sentence_zh: '我可以用你的筆嗎？' },
            { word: 'walk', translation: '走路', sentence_en: 'I walk to school.', sentence_zh: '我走路去上學。' },
            { word: 'want', translation: '想要', sentence_en: 'I want a new toy.', sentence_zh: '我想要一個新玩具。' },
            { word: 'watch', translation: '看(電視)', sentence_en: 'I watch TV every night.', sentence_zh: '我每晚都看電視。' },
            { word: 'work', translation: '工作', sentence_en: 'My father works in a factory.', sentence_zh: '我父親在一家工廠工作。' },
            { word: 'write', translation: '寫', sentence_en: 'Please write your name.', sentence_zh: '請寫下你的名字。' },
            { word: 'bad', translation: '壞的', sentence_en: 'That is a bad idea.', sentence_zh: '那真是個壞主意。' },
            { word: 'big', translation: '大的', sentence_en: 'An elephant is big.', sentence_zh: '大象很大。' },
            { word: 'black', translation: '黑色的', sentence_en: 'I have a black cat.', sentence_zh: '我有一隻黑貓。' },
            { word: 'blue', translation: '藍色的', sentence_en: 'The sky is blue.', sentence_zh: '天空是藍色的。' },
            { word: 'cold', translation: '冷的', sentence_en: 'It is cold today.', sentence_zh: '今天很冷。' },
            { word: 'fast', translation: '快的', sentence_en: 'A cheetah runs very fast.', sentence_zh: '獵豹跑得非常快。' },
            { word: 'good', translation: '好的', sentence_en: 'You are a good student.', sentence_zh: '你是個好學生。' },
            { word: 'green', translation: '綠色的', sentence_en: 'The grass is green.', sentence_zh: '草是綠色的。' },
            { word: 'happy', translation: '快樂的', sentence_en: 'I am very happy.', sentence_zh: '我非常快樂。' },
            { word: 'hot', translation: '熱的', sentence_en: 'The coffee is too hot.', sentence_zh: '這咖啡太燙了。' },
            { word: 'long', translation: '長的', sentence_en: 'She has long hair.', sentence_zh: '她有著長頭髮。' },
            { word: 'many', translation: '很多的', sentence_en: 'I have many friends.', sentence_zh: '我有很多朋友。' },
            { word: 'new', translation: '新的', sentence_en: 'I have a new bike.', sentence_zh: '我有一輛新自行車。' },
            { word: 'old', translation: '老的/舊的', sentence_en: 'My grandfather is old.', sentence_zh: '我的祖父很老了。' },
            { word: 'red', translation: '紅色的', sentence_en: 'An apple is red.', sentence_zh: '蘋果是紅色的。' },
            { word: 'sad', translation: '傷心的', sentence_en: 'Why are you sad?', sentence_zh: '你為什麼傷心？' },
            { word: 'short', translation: '短的/矮的', sentence_en: 'He is short.', sentence_zh: '他很矮。' },
            { word: 'sick', translation: '生病的', sentence_en: 'I feel sick today.', sentence_zh: '我今天覺得不舒服。' },
            { word: 'small', translation: '小的', sentence_en: 'An ant is small.', sentence_zh: '螞蟻很小。' },
            { word: 'warm', translation: '溫暖的', sentence_en: 'The weather is warm.', sentence_zh: '天氣很溫暖。' },
            { word: 'white', translation: '白色的', sentence_en: 'Snow is white.', sentence_zh: '雪是白色的。' },
            { word: 'yellow', translation: '黃色的', sentence_en: 'A banana is yellow.', sentence_zh: '香蕉是黃色的。' },
            { word: 'young', translation: '年輕的', sentence_en: 'My sister is young.', sentence_zh: '我的妹妹很年輕。' },
            { word: 'what', translation: '什麼', sentence_en: 'What is your name?', sentence_zh: '你的名字是什麼？' },
            { word: 'where', translation: '哪裡', sentence_en: 'Where do you live?', sentence_zh: '你住在哪裡？' },
            { word: 'when', translation: '何時', sentence_en: 'When is your birthday?', sentence_zh: '你的生日是什麼時候？' },
            { word: 'why', translation: '為什麼', sentence_en: 'Why are you crying?', sentence_zh: '你為什麼在哭？' },
            { word: 'who', translation: '是誰', sentence_en: 'Who is that man?', sentence_zh: '那個男人是誰？' },
            { word: 'how', translation: '如何', sentence_en: 'How are you?', sentence_zh: '你好嗎？' }
        ];

        
        let shuffleWords = []; 
        let results = {}; 
        let currentIndex = 0;

        // ** 這是完整的題庫 (baseWords) **
        // 我們用 'const' 來宣告，防止它被意外修改
        const baseWords = [...words];

        // 簡化 init() 函式
        function init() {
            // 檢查是否有儲存的自訂單字
            if (localStorage.getItem('customWords')) {
                const storedWords = JSON.parse(localStorage.getItem('customWords'));
                if (storedWords.length > 0) {
                    // 如果有自訂單字，'words' 變數就使用自訂的
                    words = storedWords; 
                } else {
                    // 如果存了個空的，就還是用預設的
                    words = [...baseWords];
                }
            } else {
                // 預設情況下，'words' 變數使用完整題庫
                words = [...baseWords];
            }
            
            shuffleAndReset(); 
            updateStats();
            updateNavigation();
        }

        // 100 題抽題邏輯
        function shuffleAndReset() {
            // 1. 永遠從 'words' 變數 (可能是預設題庫，也可能是自訂題庫) 來洗牌
            let shuffledFullList = [...words].sort(() => Math.random() - 0.5);
            
            // 2. 判斷單字庫是否超過 100
            if (shuffledFullList.length > 100) {
                // 3. 如果超過，只取前 100 個
                shuffleWords = shuffledFullList.slice(0, 100);
            } else {
                // 4. 如果沒有，就用全部
                shuffleWords = shuffledFullList;
            }

            results = {}; 
            currentIndex = 0;
            generateCurrentCard();
            updateNavigation();
            updateStats();
        }

        // 生成卡片
        function generateCurrentCard() {
            const card = document.getElementById('wordCard');
            card.innerHTML = ''; 
            card.className = 'word-card'; 

            if (shuffleWords.length === 0) {
                card.innerHTML = '<div class="word-number">沒有單字可以練習，請點「設定單字」加入。</div>';
                
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                if(prevBtn) prevBtn.disabled = true;
                if(nextBtn) nextBtn.disabled = true;
                
                return;
            }

            const wordObject = shuffleWords[currentIndex];

            // 創建單字編號
            const wordNumber = document.createElement('div');
            wordNumber.className = 'word-number';
            wordNumber.textContent = `${currentIndex + 1} / ${shuffleWords.length} 個單字`;

            // 創建單字顯示
            const wordDisplay = document.createElement('div');
            wordDisplay.className = 'word-display';
            wordDisplay.textContent = wordObject.word; 

            // 創建控制區域
            const wordControls = document.createElement('div');
            wordControls.className = 'word-controls';

            // 創建美式發音
            const speakBtn = document.createElement('button');
            speakBtn.className = 'speak-btn';
            speakBtn.textContent = '美式發音';
            speakBtn.onclick = () => speakWord(wordObject.word, "en-US");

            // 創建英式發音
            const speakBtnUK = document.createElement('button');
            speakBtnUK.className = 'speak-btn';
            speakBtnUK.textContent = '英式發音';
            speakBtnUK.onclick = () => speakWord(wordObject.word, "en-GB");

            // 創建輸入框
            const wordInput = document.createElement('input');
            wordInput.type = 'text';
            wordInput.className = 'word-input';
            wordInput.id = 'currentInput';
            wordInput.placeholder = '請輸入單字...';
            wordInput.onkeypress = (event) => handleEnterKey(event, wordObject);
            wordInput.onfocus = () => {
                setTimeout(() => {
                    wordInput.focus();
                }, 0);
            };

            // 創建檢查按鈕
            const checkBtn = document.createElement('button');
            checkBtn.className = 'check-btn';
            checkBtn.textContent = '檢查';
            checkBtn.onclick = () => checkCurrentWord(wordObject);

            // 創建結果顯示 (只顯示"正確"或"錯誤")
            const result = document.createElement('div');
            result.className = 'result';
            result.id = 'currentResult';

            // 創建 "翻譯" 顯示區 (隱藏)
            const translationDisplay = document.createElement('div');
            translationDisplay.className = 'translation-display';
            translationDisplay.id = 'translationDisplay';

            // 創建 "例句" 顯示區 (隱藏)
            const sentenceDisplay = document.createElement('div');
            sentenceDisplay.className = 'sentence-display';
            sentenceDisplay.id = 'sentenceDisplay';


            // 創建發音按鈕群組
            const speakBtnGroup = document.createElement('div');
            speakBtnGroup.className = 'speak-btn-group';
            speakBtnGroup.appendChild(speakBtn);
            speakBtnGroup.appendChild(speakBtnUK);

            wordControls.appendChild(speakBtnGroup);
            wordControls.appendChild(wordInput);
            wordControls.appendChild(checkBtn);

            // 將元素添加到DOM
            card.appendChild(wordNumber);
            card.appendChild(wordDisplay);
            card.appendChild(wordControls);
            card.appendChild(result);
            card.appendChild(translationDisplay); 
            card.appendChild(sentenceDisplay); 

            if (results.hasOwnProperty(currentIndex)) {
                displayPreviousResult();
            } else {
                wordDisplay.style.display = 'none';
            }
        }

        // 顯示結果 (填入翻譯和例句)
        function displayPreviousResult() {
            const isCorrect = results[currentIndex];
            const resultEl = document.getElementById('currentResult');
            const translationEl = document.getElementById('translationDisplay'); 
            const sentenceEl = document.getElementById('sentenceDisplay'); 
            const cardElement = document.getElementById('wordCard');
            const wordDisplayEl = document.querySelector('#wordCard .word-display'); 

            const wordObject = shuffleWords[currentIndex];
            const word = wordObject.word;
            const translation = wordObject.translation;
            const sentence_en = wordObject.sentence_en;
            const sentence_zh = wordObject.sentence_zh;

            if (isCorrect) {
                resultEl.innerHTML = '正確！';
                resultEl.className = 'result correct';
                cardElement.className = 'word-card correct';
            } else {
                resultEl.innerHTML = `錯誤！正確答案是 ${word}`;
                resultEl.className = 'result incorrect';
                cardElement.className = 'word-card incorrect';
            }

            // 填入翻譯
            translationEl.innerHTML = `<span class="translation">${translation}</span>`;
            
            // 填入例句 (包含喇叭按鈕)
            sentenceEl.innerHTML = `
                <span class="sentence-en">${sentence_en}</span>
                <button class="sentence-speak-btn" onclick="speakWord('${sentence_en.replace(/'/g, "\\'")}', 'en-US')">🔊</button>
                <br>
                <span class="sentence-zh">${sentence_zh}</span>
            `;
            
            if(wordDisplayEl) {
                wordDisplayEl.style.display = 'block';
            }
            
            const inputElement = document.getElementById('currentInput');
            const checkButton = document.querySelector('#wordCard .check-btn');
            if(inputElement) inputElement.disabled = true;
            if(checkButton) checkButton.disabled = true;
        }


        // 更新導航按鈕
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const cardInfo = document.getElementById('cardInfo');
            
            if (prevBtn) prevBtn.disabled = currentIndex === 0 || shuffleWords.length === 0;
            if (nextBtn) nextBtn.disabled = currentIndex === shuffleWords.length - 1 || shuffleWords.length === 0;
            if (cardInfo) cardInfo.textContent = shuffleWords.length === 0 ? "N/A" : `${currentIndex + 1} / ${shuffleWords.length}`;
        }

        // 上一張卡片
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                generateCurrentCard();
                updateNavigation();
            }
        }

        // 下一張卡片
        function nextCard() {
            if (currentIndex < shuffleWords.length - 1) {
                currentIndex++;
                generateCurrentCard();
                updateNavigation();
            }
        }
        
        // 發音功能 (現在也用於例句)
        function speakWord(word, lang = "en-US") {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = lang;
                utterance.rate = 0.8;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
                setTimeout(() => {
                    const inputElement = document.getElementById('currentInput');
                    if (inputElement && !inputElement.disabled) { 
                        inputElement.focus();
                    }
                }, 0);
            } else {
                alert('您的瀏覽器不支援語音合成功能');
            }
        }

        // 檢查答案 (填入翻譯和例句)
        function checkCurrentWord(wordObject) { 
            const index = currentIndex;
            const input = document.getElementById('currentInput');
            const resultEl = document.getElementById('currentResult');
            const translationEl = document.getElementById('translationDisplay'); 
            const sentenceEl = document.getElementById('sentenceDisplay'); 
            const wordCard = document.getElementById('wordCard');
            const wordDisplayEl = document.querySelector('#wordCard .word-display'); 

            if (input.disabled) return;

            const correctWord = wordObject.word;
            const translation = wordObject.translation;
            const sentence_en = wordObject.sentence_en;
            const sentence_zh = wordObject.sentence_zh;

            const userInput = input.value.trim().toLowerCase();
            const isCorrect = userInput === correctWord.toLowerCase();
            results[index] = isCorrect; 

            if (isCorrect) {
                resultEl.innerHTML = '正確！';
                resultEl.className = 'result correct';
                wordCard.className = 'word-card correct';
            } else {
                resultEl.innerHTML = `錯誤！正確答案是 ${correctWord}`;
                resultEl.className = 'result incorrect';
                wordCard.className = 'word-card incorrect';
            }
            
            // 填入翻譯
            translationEl.innerHTML = `<span class="translation">${translation}</span>`;
            
            // 填入例句
            sentenceEl.innerHTML = `
                <span class="sentence-en">${sentence_en}</span>
                <button class="sentence-speak-btn" onclick="speakWord('${sentence_en.replace(/'/g, "\\'")}', 'en-US')">🔊</button>
                <br>
                <span class="sentence-zh">${sentence_zh}</span>
            `;

            if(wordDisplayEl) {
                wordDisplayEl.style.display = 'block';
            }
            
            input.disabled = true;
            document.querySelector('#wordCard .check-btn').disabled = true;

            updateStats();
        }

        // 處理 Enter 鍵
        function handleEnterKey(event, wordObject) { 
            if (event.key === 'Enter') {
                checkCurrentWord(wordObject); 
            }
        }

        // 重置所有進度
        function resetAll() {
            results = {};
            currentIndex = 0;
            shuffleAndReset(); 
            updateNavigation();
            updateStats();
        }

        // 更新統計數據
        function updateStats() {
            const totalWords = shuffleWords.length;
            const checkedWords = Object.keys(results).length;
            const correctWords = Object.values(results).filter(result => result).length;
            const incorrectWords = checkedWords - correctWords;
            const accuracy = checkedWords > 0 ? Math.round((correctWords / checkedWords) * 100) : 0;

            document.getElementById('totalWords').textContent = totalWords;
            document.getElementById('correctCount').textContent = correctWords;
            document.getElementById('incorrectCount').textContent = incorrectWords;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('practicedCount').textContent = checkedWords;
        }

        // 開啟設定視窗
        function openWordSettings() {
            const modal = document.getElementById('wordSettingsModal');
            modal.style.display = 'flex'; 
            
            // 顯示當前使用的單字 (可能是預設的，也可能是自訂的)
            document.getElementById('customWordsTextarea').value = words.map(w => w.word).join('\n');
            document.getElementById('customWordsTextarea').focus();
        }

        // 關閉設定視窗
        function closeWordSettings() {
            document.getElementById('wordSettingsModal').style.display = 'none'; 
        }

        // 儲存設定
        function saveWordSettings() {
            const text = document.getElementById('customWordsTextarea').value;
            const newWordsStrings = text.split('\n').map(w => w.trim()).filter(w => w);
            
            if (newWordsStrings.length === 0) {
                alert('請至少輸入一個單字');
                return;
            }

            // 將字串轉換為新的物件結構
            const newWordsObjects = newWordsStrings.map(w => ({
                word: w,
                translation: '（自訂單字）',
                sentence_en: '（無例句）',
                sentence_zh: '（無例句）'
            }));

            words = newWordsObjects; // 將 'words' 變數設為自訂單字
            localStorage.setItem('customWords', JSON.stringify(newWordsObjects));
            
            shuffleAndReset(); 
            closeWordSettings(); 
        }

        // *** 修正點 2：新增「恢復預設」的函式 ***
        function restoreDefaultWords() {
            if (confirm("您確定要清除所有自訂單字，並恢復為 150+ 預設題庫嗎？")) {
                localStorage.removeItem('customWords'); // 清除儲存的自訂單字
                alert("已恢復預設題庫，網頁將會重新整理。");
                window.location.reload(); // 重新整理網頁
            }
        }


        // 頁面載入時初始化
        window.onload = init;
    </script>
